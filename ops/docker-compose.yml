# ── AX-INFRA-003: AutomationX V3 Docker Compose ──
version: '3.8'

services:
  # ── Reverse Proxy ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ax-backend
    restart: unless-stopped

  # ── Backend API Server ──
  ax-backend:
    build:
      context: ../system/backend
      dockerfile: Dockerfile
    image: ticketx-backend:latest
    # REQUIRED in .env.production: SESSION_SECRET (>= 32 chars).
    # It signs operator sessions and AgentX execution-context tokens. The
    # server now refuses to boot without it, because without it every guarded
    # route fails closed and no ticket can be created. Kept in the env file
    # rather than an inline `environment:` entry - an inline entry would
    # override the file with an empty value whenever the host shell lacks it.
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      pg-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Background Workers ──
  ax-worker:
    build:
      context: ../system/backend
      dockerfile: Dockerfile.worker
    image: ticketx-worker:latest
    # REQUIRED in .env.production: SESSION_SECRET (>= 32 chars).
    # It signs operator sessions and AgentX execution-context tokens. The
    # server now refuses to boot without it, because without it every guarded
    # route fails closed and no ticket can be created. Kept in the env file
    # rather than an inline `environment:` entry - an inline entry would
    # override the file with an empty value whenever the host shell lacks it.
    env_file:
      - .env.production
    depends_on:
      pg-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend SPA ──
  ax-frontend:
    build:
      context: ../system/frontend
      dockerfile: Dockerfile
    image: ticketx-frontend:latest
    ports:
      - "5173:80"
    restart: unless-stopped

  # ── PostgreSQL Primary ──
  pg-primary:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: automationx
      POSTGRES_USER: ax_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_pass}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../system/backend/database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ax_admin -d automationx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis Cluster ──
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
