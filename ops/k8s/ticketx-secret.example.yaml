# TicketX secret — TEMPLATE ONLY. Contains no values and must not.
#
# The previous ops/k8s/ticketx-secret.yaml carried live values for
# POSTGRES_PASSWORD, DATABASE_URL, DATABASE_REPLICA_URL, API_KEY,
# WEBHOOK_SECRET, PROMPTX_MCP_TOKEN, PLANE_API_KEY, LINE_CHANNEL_SECRET and
# LINE_CHANNEL_ACCESS_TOKEN, all committed to git. Deleting that file does not
# remove them from history — every one of those credentials must be rotated.
# See docs/CREDENTIAL_ROTATION_CHECKLIST.md.
#
# Populate the real Secret at deploy time from your secret manager, e.g.
#
#   kubectl -n ticketx create secret generic ticketx-secret \
#     --from-literal=POSTGRES_PASSWORD="$(op read op://ticketx/postgres/password)" \
#     --from-literal=DATABASE_URL="$(op read op://ticketx/postgres/url)" \
#     ... one --from-literal per key below ...
#
# or with External Secrets Operator / Sealed Secrets, whichever the cluster
# already uses. Do not reintroduce a plaintext manifest to the repository.

apiVersion: v1
kind: Secret
metadata:
  name: ticketx-secret
  namespace: ticketx
type: Opaque
stringData:
  # --- Datastores ---
  POSTGRES_PASSWORD: ""
  DATABASE_URL: ""
  DATABASE_REPLICA_URL: ""
  REDIS_URL: ""

  # --- Service-to-service auth ---
  # Shared credential for internal callers (PromptX / Activepieces flows and
  # backend workers) presenting Authorization: Bearer <API_KEY>.
  API_KEY: ""
  # Signs admin console session tokens AND AgentX execution-context tokens.
  # REQUIRED: the server refuses to boot in production without it, because
  # without it every guarded MCP route fails closed and no ticket can be
  # created. Minimum 32 characters.
  # Rotating this invalidates every active operator session and every
  # in-flight execution context (bounded by their 30-minute TTL).
  SESSION_SECRET: ""
  WEBHOOK_SECRET: ""

  # --- Third parties ---
  PROMPTX_MCP_TOKEN: ""
  PLANE_API_KEY: ""
  LINE_CHANNEL_SECRET: ""
  LINE_CHANNEL_ACCESS_TOKEN: ""
  GEMINI_API_KEY: ""

  # --- SMS (optional; omit the keys entirely if SMS alerts are disabled) ---
  THAIBULKSMS_API_KEY: ""
  THAIBULKSMS_API_SECRET: ""
